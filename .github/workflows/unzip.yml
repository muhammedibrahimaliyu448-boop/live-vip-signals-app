name: Unzip Code for Expo
on:
  push:
    branches: [ main ]
jobs:
  unzip-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Unzip Code
        run: |
          unzip -o "live-vip-signals (1).zip" -d ./
          rm "live-vip-signals (1).zip"
      - name: Commit Unzipped Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Unzip code files for Expo" || echo "No changes to commit"
          git push origin main
